project: "term project"
name: "RNN"
version: v0

train_settings:
  batch_size : 4096
  num_epochs : 500
  num_workers : 0
  pin_memory : False
  seed : 37
  
preprocess:
  scaler : normalize
  descaler : unnormalize
  sequence_length : 30
  time_step : 2
  test_size : 0.2
  random_state : 37

model:
  dataloader : Parameterloader
  model_class : model
  lstm_size : 512
  lstm_layers : 5
  output_size : 6
  drop_rate : 0.0
  w_res : 5
  w_theta : 30
  w_ode : 1

loss : ODE

optimizer:
  optim_class: Adam
  scheduler_class: CosineAnnealingLR
  lr: 1e-4
  eta_min : 1e-9
  weight_decay: 0.1
  patience : 20

directories:
  checkpoint : "src/weights/"
  data_root : "dataset/dataset.csv"
  test_root : "dataset/test.csv"
  inf_root : "src/inference"