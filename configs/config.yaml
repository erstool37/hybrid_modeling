project: "heat exchanger"
name: "test_run"
version: v0

train_settings:
  batch_size : 1024
  num_epochs : 40
  num_workers : 4

preprocess:
  scaler : znormalize
  descaler : zunnormalize
  sequence_length : 10
  time_step : 2
  test_size : 0.2
  random_state : 37

model:
  dataloader : Parameterloader
  model_class : lstmPINN
  lstm_size : 256
  lstm_layers : 3
  output_size : 6
  drop_rate : 0.1
  w_res : 1
  w_theta : 1
  w_ode : 1

loss : MAPE

optimizer:
  optim_class: Adam
  scheduler_class: CosineAnnealingLR
  lr: 1e-4
  eta_min : 1e-8
  weight_decay: 1e-5
  patience : 5

directories:
  checkpoint : "src/weights"
  data_root : "dataset/dataset.csv"